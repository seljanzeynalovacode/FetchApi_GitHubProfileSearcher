<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Inspector Pro</title>
    <!-- Google Fonts & Bootstrap 5 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 620px;">
    
    <!-- Başlıq -->
    <div class="text-center mb-4">
        <h2 class="fw-extrabold text-dark tracking-tight mb-1" style="font-weight: 800;">🚀 GitHub Inspector</h2>
        <p class="text-muted small">İstifadəçi profilini və fəaliyyətini kəşf edin</p>
    </div>
    
    <!-- Axtarış Bölməsi -->
    <div class="glass-card p-3 mb-4">
        <div class="d-flex gap-2">
            <input type="text" id="usernameInput" class="form-control search-box" placeholder="GitHub username">
            <button id="searchBtn" class="btn btn-gradient">Axtar</button>
        </div>
    </div>

    <!-- Xəta Mesajı -->
    <div id="errorMsg" class="alert alert-danger rounded-4 d-none shadow-sm text-center border-0 fw-bold"></div>

    <!-- Əsas Profil Kartı -->
    <div id="profileCard" class="glass-card p-4 d-none">
        
        <!-- Üst Profil Hissəsi -->
        <div class="text-center mb-4">
            <img id="avatar" class="avatar-img mb-3" src="" alt="Avatar">
            <h3 id="fullName" class="fw-bold text-dark mb-0"></h3>
            <span id="username" class="badge bg-indigo-soft text-primary fw-bold px-3 py-2 mt-1 rounded-pill style-badge"></span>
            <p id="bio" class="text-secondary small mt-3 px-3 mb-0" style="line-height: 1.6;"></p>
        </div>
        
        <!-- Düymələr (Repolar, Followers, Following) -->
        <div class="row g-2 mb-4 text-center">
            <div class="col-4">
                <div id="btnRepos" class="stat-card">
                    <small class="text-muted d-block fw-bold fs-7">REPOSITORIES</small>
                    <span id="reposCount" class="fs-4 fw-extrabold text-dark">0</span>
                </div>
            </div>
            <div class="col-4">
                <div id="btnFollowers" class="stat-card">
                    <small class="text-muted d-block fw-bold fs-7">FOLLOWER</small>
                    <span id="followersCount" class="fs-4 fw-extrabold text-dark">0</span>
                </div>
            </div>
            <div class="col-4">
                <div id="btnFollowing" class="stat-card">
                    <small class="text-muted d-block fw-bold fs-7">FOLLOWING</small>
                    <span id="followingCount" class="fs-4 fw-extrabold text-dark">0</span>
                </div>
            </div>
        </div>

        <!-- Aşağı Siyahı Hissəsi -->
        <div class="bg-white rounded-4 p-3 border border-light shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3 px-1">
                <h6 id="listTitle" class="fw-bold text-dark mb-0">Siyahı</h6>
                <span id="itemsCount" class="badge bg-light text-dark border rounded-pill">0 tapıldı</span>
            </div>
            
            <div id="loadingSpinner" class="text-center my-4 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="small text-muted mt-2 mb-0">Məlumatlar gətirilir...</p>
            </div>

            <div id="listContainer">
                <!-- JS tərəfindən dinamik kartlar doldurulacaq -->
            </div>
        </div>

        <!-- Fəaliyyət Qrafiki (Contribution Graph) -->
<div class="bg-white rounded-4 p-3 border border-light shadow-sm mb-3">
    <h6 class="fw-bold text-dark mb-3">📊 Son 1 İllik Fəaliyyət (Contributions)</h6>
    <div class="text-center overflow-x-auto p-1">
        <img id="contributionGraph" src="" alt="Contribution Graph" class="img-fluid" style="min-width: 600px;">
    </div>
</div>

    </div>
</div>

<script src="app.js"></script>
</body>
</html>
